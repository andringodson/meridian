<svg width="96" height="96" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meridian">
  <!-- README mark for DARK backgrounds. Same geometry as the light variant with
       the ink inverted; the accent dot is lifted to #3a3aff because #0000ee is
       too dark to read against near-black. -->
  <circle cx="16" cy="16" r="12.5" stroke="#ededed" stroke-width="2.4"/>
  <ellipse cx="16" cy="16" rx="5" ry="12.5" stroke="#ededed" stroke-width="2.4"/>
  <line x1="3.5" y1="16" x2="28.5" y2="16" stroke="#ededed" stroke-width="2.4"/>
  <circle cx="16" cy="16" r="2.6" fill="#3a3aff"/>
</svg>
