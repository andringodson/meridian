<svg width="96" height="96" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meridian">
  <!-- README mark for LIGHT backgrounds. Colours are literal, not currentColor:
       an SVG loaded through <img> cannot inherit the host page's colour, so
       currentColor resolves to black and the mark vanishes on a dark README. -->
  <circle cx="16" cy="16" r="12.5" stroke="#0b0b0b" stroke-width="2.4"/>
  <ellipse cx="16" cy="16" rx="5" ry="12.5" stroke="#0b0b0b" stroke-width="2.4"/>
  <line x1="3.5" y1="16" x2="28.5" y2="16" stroke="#0b0b0b" stroke-width="2.4"/>
  <circle cx="16" cy="16" r="2.6" fill="#0000ee"/>
</svg>
